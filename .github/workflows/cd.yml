name: CD - Build, Push, Deploy (Argo)

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "k8s/topsquad/deployment.yaml"

permissions:
  contents: write

concurrency:
  group: topsquad-cd-main
  cancel-in-progress: true

jobs:
  build_push_deploy:
    # Extra safety: if someone removes paths-ignore, still avoid looping
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(cd):') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            hadensmith/topsquad:${{ env.IMAGE_TAG }}
            hadensmith/topsquad:latest
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

      - name: Update Kubernetes deployment image
        run: |
          sed -i "s|image: hadensmith/topsquad:.*|image: hadensmith/topsquad:${IMAGE_TAG}|" k8s/topsquad/deployment.yaml

      - name: Commit and push manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/topsquad/deployment.yaml
          git commit -m "chore(cd): deploy ${IMAGE_TAG}" || exit 0
          git push

